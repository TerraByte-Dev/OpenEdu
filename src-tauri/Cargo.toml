[package]
name = "openedu"
version = "0.3.0"
description = "OpenEdu — AI-powered personalized learning"
authors = ["TerraByte"]
edition = "2021"

[lib]
name = "openedu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Total RAM for the default-model pick (src/system.rs). Both are already in Cargo.lock via other
# crates, so neither adds a package to the build; the feature only exposes GlobalMemoryStatusEx.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Size-optimized release profile for the shipped desktop binary. Trades compile time for a much
# smaller binary; panic=abort is safe for a Tauri app (no unwinding across the FFI boundary).
[profile.release]
opt-level = "z"      # optimize for binary size
lto = true           # link-time optimization across crates
codegen-units = 1    # maximize optimization (slower build)
strip = true         # strip debug symbols from the binary
panic = "abort"      # drop unwinding tables
