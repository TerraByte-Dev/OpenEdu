name: Release

# Push a version tag (e.g. v0.1.1) to build, SIGN, and publish a GitHub Release with the installers and the
# updater manifest (latest.json). Installed apps poll the latest release and auto-update from it.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Pull the tagged version's section out of CHANGELOG.md so the GitHub Release notes AND the
      # in-app updater prompt (latest.json `notes`) show real patch notes — not a generic blurb.
      - name: Build release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          section="$(awk -v ver="## [$version]" '
            /^## \[/ { if (found) exit; if (index($0, ver) == 1) { found = 1; next } }
            found && /^\[[^]]+\]: http/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d')"
          delim="CHANGELOG_EOF_${RANDOM}${RANDOM}"
          {
            echo "body<<${delim}"
            if [ -n "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
              printf '%s\n\n' "$section"
            fi
            echo "Download and run **OpenEdu_*_x64-setup.exe** (or the .msi) below to install."
            echo "Already installed? OpenEdu updates itself automatically."
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key — stored as repo Actions secrets (see CONTRIBUTING / release docs).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OpenEdu ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
