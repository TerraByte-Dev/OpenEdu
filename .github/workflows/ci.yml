name: CI

# Frontend checks for EVERY pull request, whatever it targets, plus pushes to master. Intentionally
# Node-only — the React/TS frontend type-checks, unit-tests, and bundles without the Rust/Tauri
# toolchain, so this stays fast (~1-2 min). The Tauri desktop build is not exercised here.
#
# The `branches: [master]` filter used to be here and was wrong for how this repo works. PRs are stacked
# — each one bases on the branch below it — so filtering on the BASE meant only the bottom PR of a stack
# ever ran CI. Everything above it sat unchecked until it was retargeted at master by the merge below
# it, which is the worst possible moment to discover a break: mid-merge, on the PR that is next in line.
on:
  pull_request:
  push:
    branches: [master]

# Cancel an in-progress run when new commits land on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck + build
        run: npm run build
