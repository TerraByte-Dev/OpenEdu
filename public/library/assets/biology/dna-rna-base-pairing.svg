<line x1="241.3" y1="130" x2="174.7" y2="130" class="rule"/>
<text x="334" y="134" font-size="12">A=T</text>
<line x1="252" y1="174" x2="164" y2="174" class="rule"/>
<text x="334" y="178" font-size="12">G≡C</text>
<line x1="195" y1="218" x2="221" y2="218" class="rule"/>
<text x="334" y="222" font-size="12">T=A</text>
<line x1="158" y1="262" x2="258" y2="262" class="rule"/>
<text x="334" y="266" font-size="12">C≡G</text>
<line x1="197.9" y1="306" x2="218.1" y2="306" class="rule"/>
<text x="334" y="310" font-size="12">A=T</text>
<line x1="253.3" y1="350" x2="162.7" y2="350" class="rule"/>
<text x="334" y="354" font-size="12">G≡C</text>
<line x1="239" y1="394" x2="177" y2="394" class="rule"/>
<text x="334" y="398" font-size="12">T=A</text>
<text x="28" y="444" font-size="12" class="faint">Sugar–phosphate backbones (strands) + paired bases (rungs).</text>
<text x="28" y="468" font-size="12">• A–T: adenine pairs with thymine (2 H-bonds)</text>
<text x="28" y="486" font-size="12">• G–C: guanine pairs with cytosine (3 H-bonds)</text>
<text x="28" y="504" font-size="12">• Purines: A, G  ·  Pyrimidines: C, T (U in RNA)</text>
<text x="28" y="522" font-size="12">• RNA: single-stranded; uracil (U) replaces thymine (T)</text>
</svg>
