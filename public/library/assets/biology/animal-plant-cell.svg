<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 592" role="img" aria-label="Animal vs Plant Cell">
<title>Animal vs Plant Cell</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="748" height="592"/>
<text x="28" y="40" font-size="26" font-weight="700">Animal vs Plant Cell</text>
<text x="28" y="66" font-size="13" class="faint">the main organelles of eukaryotic cells</text>
<text x="178" y="114" font-size="15" text-anchor="middle" font-weight="700">Animal cell</text>
<ellipse cx="178" cy="246" rx="140" ry="110" class="cell"/>
<circle cx="188" cy="246" r="34" class="rule"/>
<circle cx="188" cy="246" r="9" class="cell"/>
<text x="188" y="250" font-size="11" text-anchor="middle" font-weight="700">1</text>
<circle cx="188" cy="232" r="9" class="cell"/>
<text x="188" y="236" font-size="11" text-anchor="middle" font-weight="700">2</text>
<circle cx="44" cy="216" r="9" class="cell"/>
<text x="44" y="220" font-size="11" text-anchor="middle" font-weight="700">3</text>
<circle cx="118" cy="296" r="9" class="cell"/>
<text x="118" y="300" font-size="11" text-anchor="middle" font-weight="700">4</text>
<circle cx="248" cy="196" r="9" class="cell"/>
<text x="248" y="200" font-size="11" text-anchor="middle" font-weight="700">5</text>
<circle cx="108" cy="186" r="9" class="cell"/>
<text x="108" y="190" font-size="11" text-anchor="middle" font-weight="700">6</text>
<circle cx="258" cy="286" r="9" class="cell"/>
<text x="258" y="290" font-size="11" text-anchor="middle" font-weight="700">7</text>
<circle cx="208" cy="316" r="9" class="cell"/>
<text x="208" y="320" font-size="11" text-anchor="middle" font-weight="700">8</text>
<circle cx="148" cy="321" r="9" class="cell"/>
<text x="148" y="325" font-size="11" text-anchor="middle" font-weight="700">9</text>
<text x="528" y="114" font-size="15" text-anchor="middle" font-weight="700">Plant cell</text>
<rect x="388" y="136" width="280" height="220" class="cell"/>
<rect x="398" y="146" width="260" height="200" class="rule-faint"/>
<rect x="428" y="176" width="170" height="140" class="rule-faint"/>
<circle cx="608" cy="196" r="30" class="rule"/>
<circle cx="394" cy="142" r="9" class="cell"/>
<text x="394" y="146" font-size="11" text-anchor="middle" font-weight="700">10</text>
<circle cx="608" cy="196" r="9" class="cell"/>
<text x="608" y="200" font-size="11" text-anchor="middle" font-weight="700">1</text>
<circle cx="503" cy="246" r="9" class="cell"/>
<text x="503" y="250" font-size="11" text-anchor="middle" font-weight="700">12</text>
<circle cx="438" cy="316" r="9" class="cell"/>
<text x="438" y="320" font-size="11" text-anchor="middle" font-weight="700">11</text>
<circle cx="418" cy="166" r="9" class="cell"/>
<text x="418" y="170" font-size="11" text-anchor="middle" font-weight="700">5</text>
<circle cx="628" cy="316" r="9" class="cell"/>
<text x="628" y="320" font-size="11" text-anchor="middle" font-weight="700">6</text>
<text x="28" y="396" font-size="15" font-weight="700">Key</text>
<text x="28" y="426" font-size="12">1 Nucleus — holds DNA, controls the cell</text>
<text x="28" y="448" font-size="12">2 Nucleolus — makes ribosomes</text>
<text x="28" y="470" font-size="12">3 Cell membrane — controls what enters/leaves</text>
<text x="28" y="492" font-size="12">4 Cytoplasm — jelly-like fluid</text>
<text x="28" y="514" font-size="12">5 Mitochondrion — releases energy (respiration)</text>
<text x="28" y="536" font-size="12">6 Ribosomes — build proteins</text>
<text x="388" y="426" font-size="12">7 Endoplasmic reticulum — transports materials</text>
<text x="388" y="448" font-size="12">8 Golgi apparatus — packages proteins</text>
<text x="388" y="470" font-size="12">9 Lysosome — digests waste (mainly animal)</text>
<text x="388" y="492" font-size="12">10 Cell wall — rigid support (plant only)</text>
<text x="388" y="514" font-size="12">11 Chloroplast — photosynthesis (plant only)</text>
<text x="388" y="536" font-size="12">12 Central vacuole — stores water (plant only)</text>
<text x="28" y="582" font-size="12" class="faint">Both are eukaryotic (membrane-bound nucleus). Plant cells add a cell wall, chloroplasts, and a large central vacuole; animal cells have lysosomes and a round shape.</text>
</svg>
