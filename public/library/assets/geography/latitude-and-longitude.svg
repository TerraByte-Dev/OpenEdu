<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 508" role="img" aria-label="Latitude &amp; Longitude">
<title>Latitude &amp; Longitude</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="820" height="508"/>
<text x="60" y="40" font-size="26" font-weight="700">Latitude &amp; Longitude</text>
<text x="60" y="64" font-size="13" class="faint">parallels measure latitude (N/S); meridians measure longitude (E/W)</text>
<rect x="60" y="84" width="732" height="366" class="cell"/>
<line x1="121" y1="84" x2="121" y2="450" class="rule-faint"/>
<line x1="182" y1="84" x2="182" y2="450" class="rule-faint"/>
<line x1="243" y1="84" x2="243" y2="450" class="rule-faint"/>
<line x1="304" y1="84" x2="304" y2="450" class="rule-faint"/>
<line x1="365" y1="84" x2="365" y2="450" class="rule-faint"/>
<line x1="487" y1="84" x2="487" y2="450" class="rule-faint"/>
<line x1="548" y1="84" x2="548" y2="450" class="rule-faint"/>
<line x1="609" y1="84" x2="609" y2="450" class="rule-faint"/>
<line x1="670" y1="84" x2="670" y2="450" class="rule-faint"/>
<line x1="731" y1="84" x2="731" y2="450" class="rule-faint"/>
<line x1="60" y1="389" x2="792" y2="389" class="rule-faint"/>
<line x1="60" y1="328" x2="792" y2="328" class="rule-faint"/>
<line x1="60" y1="206" x2="792" y2="206" class="rule-faint"/>
<line x1="60" y1="145" x2="792" y2="145" class="rule-faint"/>
<line x1="60" y1="267" x2="792" y2="267" class="rule"/>
<line x1="426" y1="84" x2="426" y2="450" class="rule"/>
<text x="788" y="262" font-size="10" text-anchor="end">Equator 0°</text>
<text x="430" y="96" font-size="10">Prime Meridian 0°</text>
<line x1="60" y1="219.2" x2="792" y2="219.2" class="rule-faint" stroke-dasharray="5 4"/>
<text x="66" y="215.2" font-size="9" class="faint">Tropic of Cancer 23.5°N</text>
<line x1="60" y1="314.8" x2="792" y2="314.8" class="rule-faint" stroke-dasharray="5 4"/>
<text x="66" y="326.8" font-size="9" class="faint">Tropic of Capricorn 23.5°S</text>
<line x1="60" y1="131.8" x2="792" y2="131.8" class="rule-faint" stroke-dasharray="5 4"/>
<text x="66" y="127.8" font-size="9" class="faint">Arctic Circle 66.5°N</text>
<line x1="60" y1="402.2" x2="792" y2="402.2" class="rule-faint" stroke-dasharray="5 4"/>
<text x="66" y="414.2" font-size="9" class="faint">Antarctic Circle 66.5°S</text>
<text x="243" y="175.5" font-size="14" text-anchor="middle" font-weight="700" class="faint">NW</text>
<text x="609" y="175.5" font-size="14" text-anchor="middle" font-weight="700" class="faint">NE</text>
<text x="243" y="358.5" font-size="14" text-anchor="middle" font-weight="700" class="faint">SW</text>
<text x="609" y="358.5" font-size="14" text-anchor="middle" font-weight="700" class="faint">SE</text>
<text x="60" y="466" font-size="10" text-anchor="middle" class="faint">180°W</text>
<text x="182" y="466" font-size="10" text-anchor="middle" class="faint">120°W</text>
<text x="304" y="466" font-size="10" text-anchor="middle" class="faint">60°W</text>
<text x="426" y="466" font-size="10" text-anchor="middle" class="faint">0°</text>
<text x="548" y="466" font-size="10" text-anchor="middle" class="faint">60°E</text>
<text x="670" y="466" font-size="10" text-anchor="middle" class="faint">120°E</text>
<text x="792" y="466" font-size="10" text-anchor="middle" class="faint">180°E</text>
<text x="52" y="454" font-size="10" text-anchor="end" class="faint">90°S</text>
<text x="52" y="393" font-size="10" text-anchor="end" class="faint">60°S</text>
<text x="52" y="332" font-size="10" text-anchor="end" class="faint">30°S</text>
<text x="52" y="210" font-size="10" text-anchor="end" class="faint">30°N</text>
<text x="52" y="149" font-size="10" text-anchor="end" class="faint">60°N</text>
<text x="52" y="88" font-size="10" text-anchor="end" class="faint">90°N</text>
<text x="60" y="492" font-size="12" class="faint">Written latitude, longitude — e.g. (33.7°N, 84.4°W) ≈ Atlanta. Latitude 0–90°; longitude 0–180°.</text>
</svg>
