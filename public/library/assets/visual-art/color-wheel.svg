<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" role="img" aria-label="Color Wheel">
<title>Color Wheel</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="750" height="480"/>
<text x="28" y="40" font-size="26" font-weight="700">Color Wheel</text>
<text x="28" y="64" font-size="13" class="faint">the 12-hue artist's (RYB) wheel</text>
<path d="M178.2,56.8 A200,200 0 0 1 281.8,56.8 L254.8,157.3 A96,96 0 0 0 205.2,157.3 Z" fill="#ED1C24" stroke="#fff" stroke-width="2"/>
<text x="230" y="107" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">P</text>
