<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 282" role="img" aria-label="Cold War Timeline">
<title>Cold War Timeline</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="920" height="282"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--oe-svg-ink,#111)"/></marker></defs>
<text x="30" y="40" font-size="26" font-weight="700">Cold War Timeline</text>
<text x="30" y="66" font-size="13" class="faint">U.S. vs USSR, 1947–1991</text>
<line x1="66.6" y1="166" x2="66.6" y2="146" class="rule-faint"/>
<circle cx="66.6" cy="146" r="3" class="fill-faint"/>
<text x="66.6" y="140" font-size="10.5" text-anchor="middle">1947  Truman Doctrine</text>
<line x1="103.2" y1="166" x2="103.2" y2="120" class="rule-faint"/>
<circle cx="103.2" cy="120" r="3" class="fill-faint"/>
<text x="103.2" y="114" font-size="10.5" text-anchor="middle">1949  NATO formed</text>
<line x1="121.5" y1="166" x2="121.5" y2="146" class="rule-faint"/>
<circle cx="121.5" cy="146" r="3" class="fill-faint"/>
<text x="121.5" y="140" font-size="10.5" text-anchor="middle">1950  Korean War</text>
<line x1="341.1" y1="166" x2="341.1" y2="120" class="rule-faint"/>
<circle cx="341.1" cy="120" r="3" class="fill-faint"/>
<text x="341.1" y="114" font-size="10.5" text-anchor="middle">1962  Cuban Missile Crisis</text>
<line x1="469.1" y1="166" x2="469.1" y2="146" class="rule-faint"/>
<circle cx="469.1" cy="146" r="3" class="fill-faint"/>
<text x="469.1" y="140" font-size="10.5" text-anchor="middle">1969  Moon landing</text>
<line x1="835.1" y1="166" x2="835.1" y2="120" class="rule-faint"/>
<circle cx="835.1" cy="120" r="3" class="fill-faint"/>
<text x="835.1" y="114" font-size="10.5" text-anchor="middle">1989  Wall falls</text>
<line x1="871.7" y1="166" x2="871.7" y2="146" class="rule-faint"/>
<circle cx="871.7" cy="146" r="3" class="fill-faint"/>
<text x="871.7" y="140" font-size="10.5" text-anchor="middle">1991  USSR dissolves</text>
<line x1="30" y1="166" x2="890" y2="166" class="rule"/>
<line x1="30" y1="162" x2="30" y2="170" class="rule"/>
<text x="30" y="184" font-size="10" text-anchor="middle" class="faint">1945</text>
<line x1="121.5" y1="162" x2="121.5" y2="170" class="rule"/>
<text x="121.5" y="184" font-size="10" text-anchor="middle" class="faint">1950</text>
<line x1="213" y1="162" x2="213" y2="170" class="rule"/>
<text x="213" y="184" font-size="10" text-anchor="middle" class="faint">1955</text>
<line x1="304.5" y1="162" x2="304.5" y2="170" class="rule"/>
<text x="304.5" y="184" font-size="10" text-anchor="middle" class="faint">1960</text>
<line x1="396" y1="162" x2="396" y2="170" class="rule"/>
<text x="396" y="184" font-size="10" text-anchor="middle" class="faint">1965</text>
<line x1="487.4" y1="162" x2="487.4" y2="170" class="rule"/>
<text x="487.4" y="184" font-size="10" text-anchor="middle" class="faint">1970</text>
<line x1="578.9" y1="162" x2="578.9" y2="170" class="rule"/>
<text x="578.9" y="184" font-size="10" text-anchor="middle" class="faint">1975</text>
<line x1="670.4" y1="162" x2="670.4" y2="170" class="rule"/>
<text x="670.4" y="184" font-size="10" text-anchor="middle" class="faint">1980</text>
<line x1="761.9" y1="162" x2="761.9" y2="170" class="rule"/>
<text x="761.9" y="184" font-size="10" text-anchor="middle" class="faint">1985</text>
<line x1="853.4" y1="162" x2="853.4" y2="170" class="rule"/>
<text x="853.4" y="184" font-size="10" text-anchor="middle" class="faint">1990</text>
<rect x="66.6" y="180" width="274.5" height="56" class="cell"/>
<text x="203.8" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Early Cold War</text>
<text x="203.8" y="229" font-size="9.5" text-anchor="middle" class="faint">1947–1962</text>
<rect x="341.1" y="180" width="311.1" height="56" class="cell"/>
<text x="496.6" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Détente</text>
<text x="496.6" y="229" font-size="9.5" text-anchor="middle" class="faint">1962–1979</text>
<rect x="652.1" y="180" width="219.6" height="56" class="cell"/>
<text x="761.9" y="200" font-size="11.5" text-anchor="middle" font-weight="700">End of the Cold War</text>
<text x="761.9" y="229" font-size="9.5" text-anchor="middle" class="faint">1979–1991</text>
<text x="30" y="266" font-size="12" class="faint">A 45-year standoff with no direct war between the superpowers, under nuclear threat.</text>
</svg>
