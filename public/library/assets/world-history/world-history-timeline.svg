<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 282" role="img" aria-label="World History Timeline">
<title>World History Timeline</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="920" height="282"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--oe-svg-ink,#111)"/></marker></defs>
<text x="30" y="40" font-size="26" font-weight="700">World History Timeline</text>
<text x="30" y="66" font-size="13" class="faint">major eras from the first civilizations to today</text>
<line x1="92.5" y1="166" x2="92.5" y2="146" class="rule-faint"/>
<circle cx="92.5" cy="146" r="3" class="fill-faint"/>
<text x="92.5" y="140" font-size="10.5" text-anchor="middle">3100 BCE  writing</text>
<line x1="810.6" y1="166" x2="810.6" y2="120" class="rule-faint"/>
<circle cx="810.6" cy="120" r="3" class="fill-faint"/>
<text x="810.6" y="114" font-size="10.5" text-anchor="middle">1492  Columbus</text>
<line x1="876.6" y1="166" x2="876.6" y2="146" class="rule-faint"/>
<circle cx="876.6" cy="146" r="3" class="fill-faint"/>
<text x="876.6" y="140" font-size="10.5" text-anchor="middle">1914  World Wars</text>
<line x1="30" y1="166" x2="890" y2="166" class="rule"/>
<line x1="30" y1="162" x2="30" y2="170" class="rule"/>
<text x="30" y="184" font-size="10" text-anchor="middle" class="faint">3500 BCE</text>
<line x1="108.2" y1="162" x2="108.2" y2="170" class="rule"/>
<text x="108.2" y="184" font-size="10" text-anchor="middle" class="faint">3000 BCE</text>
<line x1="186.4" y1="162" x2="186.4" y2="170" class="rule"/>
<text x="186.4" y="184" font-size="10" text-anchor="middle" class="faint">2500 BCE</text>
<line x1="264.5" y1="162" x2="264.5" y2="170" class="rule"/>
<text x="264.5" y="184" font-size="10" text-anchor="middle" class="faint">2000 BCE</text>
<line x1="342.7" y1="162" x2="342.7" y2="170" class="rule"/>
<text x="342.7" y="184" font-size="10" text-anchor="middle" class="faint">1500 BCE</text>
<line x1="420.9" y1="162" x2="420.9" y2="170" class="rule"/>
<text x="420.9" y="184" font-size="10" text-anchor="middle" class="faint">1000 BCE</text>
<line x1="499.1" y1="162" x2="499.1" y2="170" class="rule"/>
<text x="499.1" y="184" font-size="10" text-anchor="middle" class="faint">500 BCE</text>
<line x1="577.3" y1="162" x2="577.3" y2="170" class="rule"/>
<text x="577.3" y="184" font-size="10" text-anchor="middle" class="faint">0</text>
<line x1="655.5" y1="162" x2="655.5" y2="170" class="rule"/>
<text x="655.5" y="184" font-size="10" text-anchor="middle" class="faint">500</text>
<line x1="733.6" y1="162" x2="733.6" y2="170" class="rule"/>
<text x="733.6" y="184" font-size="10" text-anchor="middle" class="faint">1000</text>
<line x1="811.8" y1="162" x2="811.8" y2="170" class="rule"/>
<text x="811.8" y="184" font-size="10" text-anchor="middle" class="faint">1500</text>
<line x1="890" y1="162" x2="890" y2="170" class="rule"/>
<text x="890" y="184" font-size="10" text-anchor="middle" class="faint">2000</text>
<rect x="30" y="180" width="422.2" height="56" class="cell"/>
<text x="241.1" y="200" font-size="11.5" text-anchor="middle" font-weight="700">River-Valley Civilizations</text>
<text x="241.1" y="229" font-size="9.5" text-anchor="middle" class="faint">3500 BCE–800 BCE</text>
<rect x="452.2" y="180" width="203.3" height="56" class="cell"/>
<text x="553.8" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Classical Era</text>
<text x="553.8" y="229" font-size="9.5" text-anchor="middle" class="faint">800 BCE–500</text>
<rect x="655.5" y="180" width="156.4" height="56" class="cell"/>
<text x="733.6" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Postclassical / Middle</text>
<text x="733.6" y="213" font-size="11.5" text-anchor="middle" font-weight="700">Ages</text>
<text x="733.6" y="229" font-size="9.5" text-anchor="middle" class="faint">500–1500</text>
<rect x="811.8" y="180" width="46.9" height="56" class="cell"/>
<text x="835.3" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Early</text>
<text x="835.3" y="213" font-size="11.5" text-anchor="middle" font-weight="700">Modern</text>
<text x="835.3" y="229" font-size="9.5" text-anchor="middle" class="faint">1500–1800</text>
<rect x="858.7" y="180" width="22.7" height="56" class="cell"/>
<text x="870.1" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Modern</text>
<text x="870.1" y="229" font-size="9.5" text-anchor="middle" class="faint">1800–1945</text>
<rect x="881.4" y="180" width="8.6" height="56" class="cell"/>
<text x="885.7" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Contemporary</text>
<text x="885.7" y="229" font-size="9.5" text-anchor="middle" class="faint">1945–2000</text>
<text x="30" y="266" font-size="12" class="faint">Before writing: the Stone Age and the Agricultural Revolution (~10,000 BCE).</text>
</svg>
