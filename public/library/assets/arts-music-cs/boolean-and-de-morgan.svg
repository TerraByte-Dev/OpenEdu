<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 661 475" role="img" aria-label="Boolean Logic &amp; De Morgan's Laws">
<title>Boolean Logic &amp; De Morgan's Laws</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="661" height="475"/>
<text x="28" y="50" font-size="26" font-weight="700">Boolean Logic &amp; De Morgan's Laws</text>
<text x="28" y="72" font-size="13" class="faint">values are true (1) or false (0)</text>
<text x="28" y="107" font-size="15" font-weight="700">Operator</text>
<text x="127" y="107" font-size="15" font-weight="700">Symbols</text>
<text x="217" y="107" font-size="15" font-weight="700">True when…</text>
<line x1="28" y1="113" x2="442" y2="113" class="rule-faint"/>
<text x="28" y="132" font-size="15">NOT A</text>
<text x="127" y="132" font-size="15">¬A, !A</text>
<text x="217" y="132" font-size="15">A is false (inverts)</text>
<text x="28" y="157" font-size="15">A AND B</text>
<text x="127" y="157" font-size="15">A∧B, &amp;&amp;</text>
<text x="217" y="157" font-size="15">BOTH are true</text>
<text x="28" y="182" font-size="15">A OR B</text>
<text x="127" y="182" font-size="15">A∨B, ||</text>
<text x="217" y="182" font-size="15">at least one is true</text>
<text x="28" y="207" font-size="15">A XOR B</text>
<text x="127" y="207" font-size="15">A⊕B</text>
<text x="217" y="207" font-size="15">exactly one (they differ)</text>
<text x="28" y="244" font-size="17" font-weight="700">Precedence (high → low)</text>
<text x="28" y="272" font-size="14" xml:space="preserve">• NOT → AND → OR. Use parentheses to override (like × before +).</text>
<text x="28" y="309" font-size="17" font-weight="700">De Morgan's Laws</text>
<text x="28" y="338" font-size="15" xml:space="preserve">¬(A ∧ B) = ¬A ∨ ¬B    not(A and B) = notA or notB</text>
<text x="28" y="363" font-size="15" xml:space="preserve">¬(A ∨ B) = ¬A ∧ ¬B    not(A or B)  = notA and notB</text>
<text x="28" y="393" font-size="14">To negate a compound condition: flip each term and swap AND↔OR. !(x&gt;0 &amp;&amp;</text>
<text x="28" y="417" font-size="14">y&gt;0) becomes x&lt;=0 || y&lt;=0. (See logic-gate-truth-tables for the gate</text>
<text x="28" y="441" font-size="14">symbols.)</text>
</svg>
