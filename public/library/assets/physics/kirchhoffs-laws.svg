<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 390" role="img" aria-label="Kirchhoff's Laws">
<title>Kirchhoff's Laws</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="656" height="390"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--oe-svg-ink,#111)"/></marker></defs>
<text x="28" y="40" font-size="26" font-weight="700">Kirchhoff's Laws</text>
<text x="28" y="64" font-size="13" class="faint">conservation of charge (current) and energy (voltage) in a circuit</text>
<line x1="58" y1="110" x2="388" y2="110" class="rule"/>
<line x1="58" y1="270" x2="388" y2="270" class="rule"/>
<line x1="58" y1="110" x2="58" y2="178" class="rule"/>
<line x1="44" y1="178" x2="72" y2="178" class="rule"/>
<line x1="51" y1="188" x2="65" y2="188" class="rule"/>
<line x1="58" y1="188" x2="58" y2="270" class="rule"/>
<text x="40" y="196" font-size="12" text-anchor="end" font-weight="700">EMF</text>
<text x="40" y="210" font-size="11" text-anchor="end" class="faint">(ε)</text>
<line x1="238" y1="110" x2="238" y2="146" class="rule"/><path d="M 238 146 l -9 5 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="var(--oe-svg-ink,#111)" stroke-width="1.4"/><line x1="238" y1="196" x2="238" y2="270" class="rule"/>
<text x="254" y="190" font-size="14" font-weight="700">R₁</text>
<line x1="388" y1="110" x2="388" y2="146" class="rule"/><path d="M 388 146 l -9 5 l 18 10 l -18 10 l 18 10 l -9 5" fill="none" stroke="var(--oe-svg-ink,#111)" stroke-width="1.4"/><line x1="388" y1="196" x2="388" y2="270" class="rule"/>
<text x="404" y="190" font-size="14" font-weight="700">R₂</text>
<circle cx="238" cy="110" r="3.5" class="fill-faint"/>
<circle cx="238" cy="270" r="3.5" class="fill-faint"/>
<line x1="58" y1="240" x2="58" y2="200" stroke="var(--oe-svg-ink,#111)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="66" y="220" font-size="13" font-weight="700">I</text>
<line x1="98" y1="110" x2="208" y2="110" stroke="var(--oe-svg-ink,#111)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="148" y="102" font-size="12" text-anchor="middle" font-weight="700">I</text>
<line x1="238" y1="122" x2="238" y2="138" stroke="var(--oe-svg-ink,#111)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="222" y="134" font-size="12" text-anchor="end" font-weight="700">I₁</text>
<line x1="268" y1="110" x2="358" y2="110" stroke="var(--oe-svg-ink,#111)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="313" y="102" font-size="12" text-anchor="middle" font-weight="700">I₂</text>
<line x1="388" y1="122" x2="388" y2="138" stroke="var(--oe-svg-ink,#111)" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="404" y="134" font-size="12" font-weight="700">I₂</text>
<text x="230" y="102" font-size="11" text-anchor="end" class="faint">node</text>
<text x="28" y="306" font-size="12.5">KCL (junction rule): the current entering a node equals the current leaving it.</text>
<text x="28" y="326" font-size="13" font-weight="700" xml:space="preserve">    at the node:  I = I₁ + I₂        (conservation of charge)</text>
<text x="28" y="350" font-size="12.5">KVL (loop rule): the voltage changes around any closed loop sum to zero.</text>
<text x="28" y="370" font-size="13" font-weight="700" xml:space="preserve">    around a loop:  Σε = ΣI·R        (conservation of energy)</text>
</svg>
