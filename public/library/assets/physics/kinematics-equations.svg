<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 743 270" role="img" aria-label="Kinematics Equations (1-D Motion)">
<title>Kinematics Equations (1-D Motion)</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="743" height="270"/>
<text x="28" y="50" font-size="26" font-weight="700">Kinematics Equations (1-D Motion)</text>
<text x="28" y="72" font-size="13" class="faint">constant acceleration; u = initial v, v = final v, a = accel, s = displacement, t = time</text>
<text x="28" y="107" font-size="15" xml:space="preserve">v = u + a·t</text>
<text x="28" y="132" font-size="15" xml:space="preserve">s = u·t + ½·a·t²</text>
<text x="28" y="157" font-size="15" xml:space="preserve">v² = u² + 2·a·s</text>
<text x="28" y="182" font-size="15" xml:space="preserve">s = ½·(u + v)·t</text>
<text x="28" y="212" font-size="14">Each equation omits one variable — pick the one missing your unknown. SI</text>
<text x="28" y="236" font-size="14">units: m, m/s, m/s², s. Near Earth's surface a = g ≈ 9.81 m/s² (downward).</text>
</svg>
