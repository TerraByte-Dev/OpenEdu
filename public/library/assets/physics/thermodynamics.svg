<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 538" role="img" aria-label="Thermodynamics">
<title>Thermodynamics</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="695" height="538"/>
<text x="28" y="50" font-size="26" font-weight="700">Thermodynamics</text>
<text x="28" y="72" font-size="13" class="faint">heat, temperature, and energy transfer</text>
<text x="28" y="113" font-size="17" font-weight="700">The four laws</text>
<text x="28" y="141" font-size="14" xml:space="preserve">• 0th: if A is in thermal equilibrium with B, and B with C, then A with C</text>
<text x="28" y="165" font-size="14" xml:space="preserve">  (defines temperature).</text>
<text x="28" y="189" font-size="14" xml:space="preserve">• 1st: ΔU = Q − W (energy conserved: internal-energy change = heat added −</text>
<text x="28" y="213" font-size="14" xml:space="preserve">  work done by the system).</text>
<text x="28" y="237" font-size="14" xml:space="preserve">• 2nd: heat flows hot → cold on its own; the entropy of an isolated system</text>
<text x="28" y="261" font-size="14" xml:space="preserve">  never decreases.</text>
<text x="28" y="285" font-size="14" xml:space="preserve">• 3rd: as temperature → absolute zero (0 K), entropy approaches a minimum; 0</text>
<text x="28" y="309" font-size="14" xml:space="preserve">  K is unreachable.</text>
<text x="28" y="346" font-size="17" font-weight="700">Heat &amp; temperature</text>
<text x="28" y="375" font-size="15" xml:space="preserve">Warm a substance  Q = m·c·ΔT   (c = specific heat)</text>
<text x="28" y="400" font-size="15" xml:space="preserve">Phase change      Q = m·L       (L = latent heat)</text>
<text x="28" y="425" font-size="15" xml:space="preserve">Kelvin            K = °C + 273.15</text>
<text x="28" y="450" font-size="15" xml:space="preserve">Fahrenheit        °F = (9/5)·°C + 32</text>
<text x="28" y="480" font-size="14">Heat transfer happens by conduction (contact), convection (fluid flow), and</text>
<text x="28" y="504" font-size="14">radiation (EM waves).</text>
</svg>
