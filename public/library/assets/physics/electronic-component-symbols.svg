<line x1="78" y1="468" x2="98" y2="468" class="rule"/><circle cx="112" cy="468" r="14" class="rule"/><text x="112" y="473" font-size="14" text-anchor="middle" font-weight="700">A</text><line x1="126" y1="468" x2="146" y2="468" class="rule"/>
<text x="112" y="514" font-size="12" text-anchor="middle" font-weight="700">Ammeter</text>
