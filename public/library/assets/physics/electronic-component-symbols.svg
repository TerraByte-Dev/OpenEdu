<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 536" role="img" aria-label="Electronic Component Symbols">
<title>Electronic Component Symbols</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="764" height="536"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--oe-svg-ink,#111)"/></marker></defs>
<text x="28" y="40" font-size="26" font-weight="700">Electronic Component Symbols</text>
<text x="28" y="64" font-size="13" class="faint">standard schematic symbols (US/ANSI style)</text>
<rect x="28" y="80" width="168" height="104" class="cell"/>
<line x1="78" y1="126" x2="146" y2="126" class="rule"/>
<text x="112" y="172" font-size="12" text-anchor="middle" font-weight="700">Wire / conductor</text>
