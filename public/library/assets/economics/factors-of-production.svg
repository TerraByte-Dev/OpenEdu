<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 661 295" role="img" aria-label="The Four Factors of Production">
<title>The Four Factors of Production</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="661" height="295"/>
<text x="28" y="50" font-size="26" font-weight="700">The Four Factors of Production</text>
<text x="28" y="72" font-size="13" class="faint">the resources used to make everything</text>
<text x="28" y="107" font-size="15" font-weight="700">Factor</text>
<text x="199" y="107" font-size="15" font-weight="700">What it is</text>
<text x="550" y="107" font-size="15" font-weight="700">Income</text>
<line x1="28" y1="113" x2="622" y2="113" class="rule-faint"/>
<text x="28" y="132" font-size="15">Land</text>
<text x="199" y="132" font-size="15">natural resources (water, oil, soil)</text>
<text x="550" y="132" font-size="15">Rent</text>
<text x="28" y="157" font-size="15">Labor</text>
<text x="199" y="157" font-size="15">human effort &amp; skills</text>
<text x="550" y="157" font-size="15">Wages</text>
<text x="28" y="182" font-size="15">Capital</text>
<text x="199" y="182" font-size="15">tools, machines, factories</text>
<text x="550" y="182" font-size="15">Interest</text>
<text x="28" y="207" font-size="15">Entrepreneurship</text>
<text x="199" y="207" font-size="15">organizes the rest; takes the risk</text>
<text x="550" y="207" font-size="15">Profit</text>
<text x="28" y="237" font-size="14">'Capital' means physical tools, not money. Because resources are scarce,</text>
<text x="28" y="261" font-size="14">every economy chooses what, how, and for whom to produce.</text>
</svg>
