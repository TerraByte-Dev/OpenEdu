<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 532" role="img" aria-label="Supply and Demand">
<title>Supply and Demand</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="560" height="532"/>
<text x="28" y="40" font-size="26" font-weight="700">Supply and Demand</text>
<text x="28" y="66" font-size="13" class="faint">price vs quantity — equilibrium is where the curves cross</text>
<rect x="28" y="92" width="504" height="360" class="cell"/>
<line x1="78.4" y1="92" x2="78.4" y2="452" class="rule-faint"/>
<line x1="128.8" y1="92" x2="128.8" y2="452" class="rule-faint"/>
<line x1="179.2" y1="92" x2="179.2" y2="452" class="rule-faint"/>
<line x1="229.6" y1="92" x2="229.6" y2="452" class="rule-faint"/>
<line x1="280" y1="92" x2="280" y2="452" class="rule-faint"/>
<line x1="330.4" y1="92" x2="330.4" y2="452" class="rule-faint"/>
<line x1="380.8" y1="92" x2="380.8" y2="452" class="rule-faint"/>
<line x1="431.2" y1="92" x2="431.2" y2="452" class="rule-faint"/>
<line x1="481.6" y1="92" x2="481.6" y2="452" class="rule-faint"/>
<line x1="532" y1="92" x2="532" y2="452" class="rule-faint"/>
<line x1="28" y1="416" x2="532" y2="416" class="rule-faint"/>
<line x1="28" y1="380" x2="532" y2="380" class="rule-faint"/>
<line x1="28" y1="344" x2="532" y2="344" class="rule-faint"/>
<line x1="28" y1="308" x2="532" y2="308" class="rule-faint"/>
<line x1="28" y1="272" x2="532" y2="272" class="rule-faint"/>
<line x1="28" y1="236" x2="532" y2="236" class="rule-faint"/>
<line x1="28" y1="200" x2="532" y2="200" class="rule-faint"/>
<line x1="28" y1="164" x2="532" y2="164" class="rule-faint"/>
<line x1="28" y1="128" x2="532" y2="128" class="rule-faint"/>
<line x1="28" y1="92" x2="532" y2="92" class="rule-faint"/>
<line x1="28" y1="92" x2="28" y2="452" class="rule"/>
<line x1="28" y1="452" x2="532" y2="452" class="rule"/>
<polyline points="78.4,416 481.6,128" fill="none" stroke="var(--oe-svg-ink,#111)" stroke-width="2"/>
<polyline points="78.4,128 481.6,416" fill="none" stroke="var(--oe-svg-ink,#111)" stroke-width="2"/>
<circle cx="280" cy="272" r="4" class="fill-faint"/>
<text x="287" y="268" font-size="10">Equilibrium</text>
<text x="451.4" y="120.8" font-size="13" text-anchor="start" font-weight="700">Supply</text>
<text x="451.4" y="405.2" font-size="13" text-anchor="start" font-weight="700">Demand</text>
<text x="43.1" y="138.8" font-size="10" text-anchor="start" font-weight="400" class="faint">surplus (price too high)</text>
<text x="43.1" y="408.8" font-size="10" text-anchor="start" font-weight="400" class="faint">shortage (price too low)</text>
<text x="532" y="468" font-size="11" text-anchor="end" class="faint">Quantity →</text>
<text x="28" y="86" font-size="11" class="faint">Price ↑</text>
<text x="28" y="490" font-size="12" class="faint">Above equilibrium → surplus → price falls. Below → shortage → price</text>
<text x="28" y="506" font-size="12" class="faint">rises. Any non-price factor SHIFTS a whole curve.</text>
</svg>
