<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 927 280" role="img" aria-label="Civil War &amp; Reconstruction">
<title>Civil War &amp; Reconstruction</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="927" height="280"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--oe-svg-ink,#111)"/></marker></defs>
<text x="30" y="40" font-size="26" font-weight="700">Civil War &amp; Reconstruction</text>
<text x="30" y="66" font-size="13" class="faint">1861–1877</text>
<line x1="77.8" y1="166" x2="77.8" y2="146" class="rule-faint"/>
<circle cx="77.8" cy="146" r="3" class="fill-faint"/>
<text x="77.8" y="140" font-size="10.5" text-anchor="middle">1861  Fort Sumter</text>
<line x1="173.3" y1="166" x2="173.3" y2="120" class="rule-faint"/>
<circle cx="173.3" cy="120" r="3" class="fill-faint"/>
<text x="173.3" y="114" font-size="10.5" text-anchor="middle">1863  Emancipation</text>
<line x1="268.9" y1="166" x2="268.9" y2="146" class="rule-faint"/>
<circle cx="268.9" cy="146" r="3" class="fill-faint"/>
<text x="268.9" y="140" font-size="10.5" text-anchor="middle">1865  Appomattox; 13th Am.</text>
<line x1="412.2" y1="166" x2="412.2" y2="120" class="rule-faint"/>
<circle cx="412.2" cy="120" r="3" class="fill-faint"/>
<text x="412.2" y="114" font-size="10.5" text-anchor="middle">1868  14th Am.</text>
<line x1="507.8" y1="166" x2="507.8" y2="146" class="rule-faint"/>
<circle cx="507.8" cy="146" r="3" class="fill-faint"/>
<text x="507.8" y="140" font-size="10.5" text-anchor="middle">1870  15th Am.</text>
<line x1="842.2" y1="166" x2="842.2" y2="120" class="rule-faint"/>
<circle cx="842.2" cy="120" r="3" class="fill-faint"/>
<text x="842.2" y="114" font-size="10.5" text-anchor="middle">1877  Reconstruction ends</text>
<line x1="30" y1="166" x2="890" y2="166" class="rule"/>
<line x1="30" y1="162" x2="30" y2="170" class="rule"/>
<text x="30" y="184" font-size="10" text-anchor="middle" class="faint">1860</text>
<line x1="125.6" y1="162" x2="125.6" y2="170" class="rule"/>
<text x="125.6" y="184" font-size="10" text-anchor="middle" class="faint">1862</text>
<line x1="221.1" y1="162" x2="221.1" y2="170" class="rule"/>
<text x="221.1" y="184" font-size="10" text-anchor="middle" class="faint">1864</text>
<line x1="316.7" y1="162" x2="316.7" y2="170" class="rule"/>
<text x="316.7" y="184" font-size="10" text-anchor="middle" class="faint">1866</text>
<line x1="412.2" y1="162" x2="412.2" y2="170" class="rule"/>
<text x="412.2" y="184" font-size="10" text-anchor="middle" class="faint">1868</text>
<line x1="507.8" y1="162" x2="507.8" y2="170" class="rule"/>
<text x="507.8" y="184" font-size="10" text-anchor="middle" class="faint">1870</text>
<line x1="603.3" y1="162" x2="603.3" y2="170" class="rule"/>
<text x="603.3" y="184" font-size="10" text-anchor="middle" class="faint">1872</text>
<line x1="698.9" y1="162" x2="698.9" y2="170" class="rule"/>
<text x="698.9" y="184" font-size="10" text-anchor="middle" class="faint">1874</text>
<line x1="794.4" y1="162" x2="794.4" y2="170" class="rule"/>
<text x="794.4" y="184" font-size="10" text-anchor="middle" class="faint">1876</text>
<line x1="890" y1="162" x2="890" y2="170" class="rule"/>
<text x="890" y="184" font-size="10" text-anchor="middle" class="faint">1878</text>
<rect x="77.8" y="180" width="191.1" height="56" class="cell"/>
<text x="173.3" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Civil War</text>
<text x="173.3" y="229" font-size="9.5" text-anchor="middle" class="faint">1861–1865</text>
<rect x="268.9" y="180" width="573.3" height="56" class="cell"/>
<text x="555.6" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Reconstruction</text>
<text x="555.6" y="229" font-size="9.5" text-anchor="middle" class="faint">1865–1877</text>
<text x="30" y="266" font-size="12" class="faint">Lincoln elected 1860 → Southern secession. The Union was preserved and slavery abolished.</text>
</svg>
