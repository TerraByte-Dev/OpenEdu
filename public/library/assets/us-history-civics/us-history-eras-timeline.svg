<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 282" role="img" aria-label="U.S. History Eras">
<title>U.S. History Eras</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="920" height="282"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--oe-svg-ink,#111)"/></marker></defs>
<text x="30" y="40" font-size="26" font-weight="700">U.S. History Eras</text>
<text x="30" y="66" font-size="13" class="faint">major periods from European contact to today (eras overlap at the edges)</text>
<line x1="488.2" y1="166" x2="488.2" y2="146" class="rule-faint"/>
<circle cx="488.2" cy="146" r="3" class="fill-faint"/>
<text x="488.2" y="140" font-size="10.5" text-anchor="middle">1776  Declaration of Independence</text>
<line x1="625.4" y1="166" x2="625.4" y2="120" class="rule-faint"/>
<circle cx="625.4" cy="120" r="3" class="fill-faint"/>
<text x="625.4" y="114" font-size="10.5" text-anchor="middle">1861  Civil War begins</text>
<line x1="735.1" y1="166" x2="735.1" y2="146" class="rule-faint"/>
<circle cx="735.1" cy="146" r="3" class="fill-faint"/>
<text x="735.1" y="140" font-size="10.5" text-anchor="middle">1929  Great Depression</text>
<line x1="754.5" y1="166" x2="754.5" y2="120" class="rule-faint"/>
<circle cx="754.5" cy="120" r="3" class="fill-faint"/>
<text x="754.5" y="114" font-size="10.5" text-anchor="middle">1941  U.S. enters WWII</text>
<line x1="30" y1="166" x2="890" y2="166" class="rule"/>
<line x1="42.9" y1="162" x2="42.9" y2="170" class="rule"/>
<text x="42.9" y="184" font-size="10" text-anchor="middle" class="faint">1500</text>
<line x1="204.3" y1="162" x2="204.3" y2="170" class="rule"/>
<text x="204.3" y="184" font-size="10" text-anchor="middle" class="faint">1600</text>
<line x1="365.6" y1="162" x2="365.6" y2="170" class="rule"/>
<text x="365.6" y="184" font-size="10" text-anchor="middle" class="faint">1700</text>
<line x1="527" y1="162" x2="527" y2="170" class="rule"/>
<text x="527" y="184" font-size="10" text-anchor="middle" class="faint">1800</text>
<line x1="688.3" y1="162" x2="688.3" y2="170" class="rule"/>
<text x="688.3" y="184" font-size="10" text-anchor="middle" class="faint">1900</text>
<line x1="849.7" y1="162" x2="849.7" y2="170" class="rule"/>
<text x="849.7" y="184" font-size="10" text-anchor="middle" class="faint">2000</text>
<rect x="30" y="180" width="437.3" height="56" class="cell"/>
<text x="248.6" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Exploration &amp; Colonization</text>
<text x="248.6" y="229" font-size="9.5" text-anchor="middle" class="faint">1492–1763</text>
<rect x="467.3" y="180" width="42" height="56" class="cell"/>
<text x="488.2" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Revolution</text>
<text x="488.2" y="213" font-size="11.5" text-anchor="middle" font-weight="700">&amp;</text>
<text x="488.2" y="226" font-size="11.5" text-anchor="middle" font-weight="700">Founding</text>
<text x="488.2" y="229" font-size="9.5" text-anchor="middle" class="faint">1763–1789</text>
<rect x="509.2" y="180" width="116.2" height="56" class="cell"/>
<text x="567.3" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Expansion &amp;</text>
<text x="567.3" y="213" font-size="11.5" text-anchor="middle" font-weight="700">Early Republic</text>
<text x="567.3" y="229" font-size="9.5" text-anchor="middle" class="faint">1789–1861</text>
<rect x="625.4" y="180" width="25.8" height="56" class="cell"/>
<text x="638.3" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Civil</text>
<text x="638.3" y="213" font-size="11.5" text-anchor="middle" font-weight="700">War &amp;</text>
<text x="638.3" y="226" font-size="11.5" text-anchor="middle" font-weight="700">Reconstruction</text>
<text x="638.3" y="229" font-size="9.5" text-anchor="middle" class="faint">1861–1877</text>
<rect x="651.2" y="180" width="37.1" height="56" class="cell"/>
<text x="669.8" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Industrialization</text>
<text x="669.8" y="213" font-size="11.5" text-anchor="middle" font-weight="700">&amp;</text>
<text x="669.8" y="226" font-size="11.5" text-anchor="middle" font-weight="700">Gilded</text>
<text x="669.8" y="239" font-size="11.5" text-anchor="middle" font-weight="700">Age</text>
<text x="669.8" y="229" font-size="9.5" text-anchor="middle" class="faint">1877–1900</text>
<rect x="688.3" y="180" width="72.6" height="56" class="cell"/>
<text x="724.6" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Progressive</text>
<text x="724.6" y="213" font-size="11.5" text-anchor="middle" font-weight="700">Era &amp;</text>
<text x="724.6" y="226" font-size="11.5" text-anchor="middle" font-weight="700">World Wars</text>
<text x="724.6" y="229" font-size="9.5" text-anchor="middle" class="faint">1900–1945</text>
<rect x="760.9" y="180" width="74.2" height="56" class="cell"/>
<text x="798" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Cold War</text>
<text x="798" y="229" font-size="9.5" text-anchor="middle" class="faint">1945–1991</text>
<rect x="835.1" y="180" width="54.9" height="56" class="cell"/>
<text x="862.6" y="200" font-size="11.5" text-anchor="middle" font-weight="700">Contemporary</text>
<text x="862.6" y="229" font-size="9.5" text-anchor="middle" class="faint">1991–2025</text>
<text x="30" y="266" font-size="12" class="faint">Dates mark the turning points historians use; periods blend at their boundaries.</text>
</svg>
