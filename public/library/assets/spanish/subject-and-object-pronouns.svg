<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 524" role="img" aria-label="Spanish Pronouns">
<title>Spanish Pronouns</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="695" height="524"/>
<text x="28" y="50" font-size="26" font-weight="700">Spanish Pronouns</text>
<text x="28" y="72" font-size="13" class="faint">subject, object, and reflexive sets</text>
<text x="28" y="107" font-size="15" font-weight="700"></text>
<text x="82" y="107" font-size="15" font-weight="700">Subject</text>
<text x="208" y="107" font-size="15" font-weight="700">Dir. obj.</text>
<text x="316" y="107" font-size="15" font-weight="700">Ind. obj.</text>
<text x="424" y="107" font-size="15" font-weight="700">Reflexive</text>
<line x1="28" y1="113" x2="505" y2="113" class="rule-faint"/>
<text x="28" y="132" font-size="15">1s</text>
<text x="82" y="132" font-size="15">yo</text>
<text x="208" y="132" font-size="15">me</text>
<text x="316" y="132" font-size="15">me</text>
<text x="424" y="132" font-size="15">me</text>
<text x="28" y="157" font-size="15">2s</text>
<text x="82" y="157" font-size="15">tú</text>
<text x="208" y="157" font-size="15">te</text>
<text x="316" y="157" font-size="15">te</text>
<text x="424" y="157" font-size="15">te</text>
<text x="28" y="182" font-size="15">3s</text>
<text x="82" y="182" font-size="15">él/ella/Ud.</text>
<text x="208" y="182" font-size="15">lo/la</text>
<text x="316" y="182" font-size="15">le</text>
<text x="424" y="182" font-size="15">se</text>
<text x="28" y="207" font-size="15">1pl</text>
<text x="82" y="207" font-size="15">nosotros</text>
<text x="208" y="207" font-size="15">nos</text>
<text x="316" y="207" font-size="15">nos</text>
<text x="424" y="207" font-size="15">nos</text>
<text x="28" y="232" font-size="15">2pl</text>
<text x="82" y="232" font-size="15">vosotros</text>
<text x="208" y="232" font-size="15">os</text>
<text x="316" y="232" font-size="15">os</text>
<text x="424" y="232" font-size="15">os</text>
<text x="28" y="257" font-size="15">3pl</text>
<text x="82" y="257" font-size="15">ellos/Uds.</text>
<text x="208" y="257" font-size="15">los/las</text>
<text x="316" y="257" font-size="15">les</text>
<text x="424" y="257" font-size="15">se</text>
<text x="28" y="294" font-size="17" font-weight="700">Notes</text>
<text x="28" y="322" font-size="14" xml:space="preserve">• Subject pronouns are usually dropped; use them for emphasis.</text>
<text x="28" y="346" font-size="14" xml:space="preserve">• Direct object receives the action: Lo veo.</text>
<text x="28" y="370" font-size="14" xml:space="preserve">• Indirect object = to/for whom: Le doy el libro.</text>
<text x="28" y="394" font-size="14" xml:space="preserve">• Reflexive = subject acts on itself: Me lavo.</text>
<text x="28" y="418" font-size="14" xml:space="preserve">• Placement: before a conjugated verb, or attached to an infinitive / gerund</text>
<text x="28" y="442" font-size="14" xml:space="preserve">  / affirmative command.</text>
<text x="28" y="466" font-size="14" xml:space="preserve">• Two pronouns: indirect before direct; le/les → se before lo/la/los/las (se</text>
<text x="28" y="490" font-size="14" xml:space="preserve">  lo doy).</text>
</svg>
