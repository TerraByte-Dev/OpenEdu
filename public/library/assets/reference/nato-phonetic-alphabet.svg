<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 678 495" role="img" aria-label="NATO Phonetic Alphabet">
<title>NATO Phonetic Alphabet</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="678" height="495"/>
<text x="28" y="50" font-size="26" font-weight="700">NATO Phonetic Alphabet</text>
<text x="28" y="72" font-size="13" class="faint">the NATO/ICAO spelling alphabet</text>
<text x="28" y="107" font-size="15">A Alfa</text>
<text x="136" y="107" font-size="15">B Bravo</text>
<text x="28" y="132" font-size="15">C Charlie</text>
<text x="136" y="132" font-size="15">D Delta</text>
<text x="28" y="157" font-size="15">E Echo</text>
<text x="136" y="157" font-size="15">F Foxtrot</text>
<text x="28" y="182" font-size="15">G Golf</text>
<text x="136" y="182" font-size="15">H Hotel</text>
<text x="28" y="207" font-size="15">I India</text>
<text x="136" y="207" font-size="15">J Juliett</text>
<text x="28" y="232" font-size="15">K Kilo</text>
<text x="136" y="232" font-size="15">L Lima</text>
<text x="28" y="257" font-size="15">M Mike</text>
<text x="136" y="257" font-size="15">N November</text>
<text x="28" y="282" font-size="15">O Oscar</text>
<text x="136" y="282" font-size="15">P Papa</text>
<text x="28" y="307" font-size="15">Q Quebec</text>
<text x="136" y="307" font-size="15">R Romeo</text>
<text x="28" y="332" font-size="15">S Sierra</text>
<text x="136" y="332" font-size="15">T Tango</text>
<text x="28" y="357" font-size="15">U Uniform</text>
<text x="136" y="357" font-size="15">V Victor</text>
<text x="28" y="382" font-size="15">W Whiskey</text>
<text x="136" y="382" font-size="15">X X-ray</text>
<text x="28" y="407" font-size="15">Y Yankee</text>
<text x="136" y="407" font-size="15">Z Zulu</text>
<text x="28" y="437" font-size="14">Note the deliberate spellings “Alfa” and “Juliett” so non-English speakers</text>
<text x="28" y="461" font-size="14">pronounce them correctly; in aviation “9” is often said “niner.”</text>
</svg>
