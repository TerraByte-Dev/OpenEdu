<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 637" role="img" aria-label="Morse Code">
<title>Morse Code</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="686" height="637"/>
<text x="28" y="50" font-size="26" font-weight="700">Morse Code</text>
<text x="28" y="72" font-size="13" class="faint">dot = short (.), dash = long (−)</text>
<text x="28" y="113" font-size="17" font-weight="700">Letters</text>
<text x="28" y="142" font-size="15">A .-</text>
<text x="109" y="142" font-size="15">B -...</text>
<text x="190" y="142" font-size="15">C -.-.</text>
<text x="271" y="142" font-size="15">D -..</text>
<text x="28" y="167" font-size="15">E .</text>
<text x="109" y="167" font-size="15">F ..-.</text>
<text x="190" y="167" font-size="15">G --.</text>
<text x="271" y="167" font-size="15">H ....</text>
<text x="28" y="192" font-size="15">I ..</text>
<text x="109" y="192" font-size="15">J .---</text>
<text x="190" y="192" font-size="15">K -.-</text>
<text x="271" y="192" font-size="15">L .-..</text>
<text x="28" y="217" font-size="15">M --</text>
<text x="109" y="217" font-size="15">N -.</text>
<text x="190" y="217" font-size="15">O ---</text>
<text x="271" y="217" font-size="15">P .--.</text>
<text x="28" y="242" font-size="15">Q --.-</text>
<text x="109" y="242" font-size="15">R .-.</text>
<text x="190" y="242" font-size="15">S ...</text>
<text x="271" y="242" font-size="15">T -</text>
<text x="28" y="267" font-size="15">U ..-</text>
<text x="109" y="267" font-size="15">V ...-</text>
<text x="190" y="267" font-size="15">W .--</text>
<text x="271" y="267" font-size="15">X -..-</text>
<text x="28" y="292" font-size="15">Y -.--</text>
<text x="109" y="292" font-size="15">Z --..</text>
<text x="28" y="329" font-size="17" font-weight="700">Digits</text>
<text x="28" y="358" font-size="15">0 -----</text>
<text x="118" y="358" font-size="15">1 .----</text>
<text x="208" y="358" font-size="15">2 ..---</text>
<text x="298" y="358" font-size="15">3 ...--</text>
<text x="388" y="358" font-size="15">4 ....-</text>
<text x="28" y="383" font-size="15">5 .....</text>
<text x="118" y="383" font-size="15">6 -....</text>
<text x="208" y="383" font-size="15">7 --...</text>
<text x="298" y="383" font-size="15">8 ---..</text>
<text x="388" y="383" font-size="15">9 ----.</text>
<text x="28" y="420" font-size="17" font-weight="700">Common punctuation &amp; signals</text>
<text x="28" y="449" font-size="15">Period</text>
<text x="127" y="449" font-size="15">.-.-.-</text>
<text x="28" y="474" font-size="15">Comma</text>
<text x="127" y="474" font-size="15">--..--</text>
<text x="28" y="499" font-size="15">Question</text>
<text x="127" y="499" font-size="15">..--..</text>
<text x="28" y="524" font-size="15">Slash</text>
<text x="127" y="524" font-size="15">-..-.</text>
<text x="28" y="549" font-size="15">SOS</text>
<text x="127" y="549" font-size="15">...---...</text>
<text x="28" y="579" font-size="14">Timing: a dash is 3× a dot; gap between letters = one dash; between words =</text>
<text x="28" y="603" font-size="14">seven dots.</text>
</svg>
