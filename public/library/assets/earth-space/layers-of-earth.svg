<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 400" role="img" aria-label="Layers of the Earth">
<title>Layers of the Earth</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="630" height="400"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--oe-svg-ink,#111)"/></marker></defs>
<text x="28" y="40" font-size="26" font-weight="700">Layers of the Earth</text>
<text x="28" y="66" font-size="13" class="faint">interior layers by composition; the core splits by state (depth from surface)</text>
<circle cx="156" cy="224" r="28" class="fill-faint"/>
<text x="156" y="228" font-size="12" text-anchor="middle" font-weight="700">Inner core</text>
<circle cx="156" cy="224" r="64" class="rule-faint"/>
<circle cx="201.3" cy="178.7" r="4" class="fill-faint"/>
<line x1="205.3" y1="178.7" x2="304" y2="116" class="rule-faint"/>
<text x="310" y="120" font-size="12">Outer core  —  liquid Fe-Ni · 2890–5150 km · makes the magnetic field</text>
<circle cx="156" cy="224" r="94" class="rule-faint"/>
<circle cx="222.5" cy="157.5" r="4" class="fill-faint"/>
<line x1="226.5" y1="157.5" x2="304" y2="146" class="rule-faint"/>
<text x="310" y="150" font-size="12">Mantle  —  hot silicate rock · 70–2890 km · slow convection</text>
<circle cx="156" cy="224" r="124" class="rule-faint"/>
<circle cx="243.7" cy="136.3" r="4" class="fill-faint"/>
<line x1="247.7" y1="136.3" x2="304" y2="176" class="rule-faint"/>
<text x="310" y="180" font-size="12">Crust  —  thin solid rock · 0–~70 km</text>
<text x="28" y="388" font-size="12" class="faint">Inner core: solid iron-nickel, 5150–6371 km, ~5200 °C (kept solid by pressure). Crust + upper mantle = lithosphere (the plates).</text>
</svg>
