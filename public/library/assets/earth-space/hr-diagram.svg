<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 548" role="img" aria-label="The H-R Diagram">
<title>The H-R Diagram</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="560" height="548"/>
<text x="28" y="40" font-size="26" font-weight="700">The H-R Diagram</text>
<text x="28" y="66" font-size="13" class="faint">Hertzsprung–Russell: luminosity vs. surface temperature</text>
<rect x="28" y="92" width="504" height="360" class="cell"/>
<line x1="28" y1="92" x2="28" y2="452" class="rule"/>
<line x1="28" y1="452" x2="532" y2="452" class="rule"/>
<polyline points="88.5,128 481.6,408.8" fill="none" stroke="var(--oe-svg-ink,#111)" stroke-width="2"/>
<circle cx="290.1" cy="264.8" r="4" class="fill-faint"/>
<text x="297.1" y="260.8" font-size="10">Sun (main sequence)</text>
<circle cx="441.3" cy="164" r="4" class="fill-faint"/>
<text x="448.3" y="160" font-size="10">Red giants</text>
<circle cx="254.8" cy="113.6" r="4" class="fill-faint"/>
<text x="261.8" y="109.6" font-size="10">Supergiants</text>
<circle cx="138.9" cy="380" r="4" class="fill-faint"/>
<text x="145.9" y="376" font-size="10">White dwarfs</text>
<text x="532" y="468" font-size="11" text-anchor="end" class="faint">← hotter      Temperature      cooler →</text>
<text x="28" y="86" font-size="11" class="faint">Luminosity ↑</text>
<text x="28" y="490" font-size="12" class="faint">Most stars lie on the main sequence (the diagonal), fusing hydrogen.</text>
<text x="28" y="506" font-size="12" class="faint">Stars evolve OFF it into giants, then end as white dwarfs (or</text>
<text x="28" y="522" font-size="12" class="faint">supernovae).</text>
</svg>
