<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 549 568" role="img" aria-label="MyPlate Food Groups">
<title>MyPlate Food Groups</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="549" height="568"/>
<text x="28" y="40" font-size="26" font-weight="700">MyPlate Food Groups</text>
<text x="28" y="64" font-size="13" class="faint">USDA — a balanced meal (replaced the Food Pyramid, 2011)</text>
<circle cx="200" cy="250" r="170" fill="#fff" stroke="var(--oe-svg-ink,#111)" stroke-width="2"/>
<path d="M40,250 A160,160 0 0 1 249.4,97.8 L200,250 A0,0 0 0 0 200,250 Z" fill="#E8A317" stroke="#fff" stroke-width="2"/>
<text x="145.5" y="174.9" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Grains</text>
<text x="145.5" y="190.9" font-size="11" text-anchor="middle" fill="#fff">30%</text>
<path d="M249.4,97.8 A160,160 0 0 1 360,250 L200,250 A0,0 0 0 0 200,250 Z" fill="#7A3E9D" stroke="#fff" stroke-width="2"/>
<text x="275.1" y="195.5" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Protein</text>
<text x="275.1" y="211.5" font-size="11" text-anchor="middle" fill="#fff">20%</text>
<path d="M360,250 A160,160 0 0 1 329.4,344 L200,250 A0,0 0 0 0 200,250 Z" fill="#D2333C" stroke="#fff" stroke-width="2"/>
<text x="288.3" y="278.7" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Fruits</text>
<text x="288.3" y="294.7" font-size="11" text-anchor="middle" fill="#fff">10%</text>
<path d="M329.4,344 A160,160 0 0 1 40,250 L200,250 A0,0 0 0 0 200,250 Z" fill="#3FA535" stroke="#fff" stroke-width="2"/>
<text x="171.3" y="338.3" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Vegetables</text>
<text x="171.3" y="354.3" font-size="11" text-anchor="middle" fill="#fff">40%</text>
<circle cx="440" cy="210" r="40" fill="#3B7CC4" stroke="var(--oe-svg-ink,#111)"/>
<text x="440" y="215" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">Dairy</text>
<text x="28" y="470" font-size="13">• Make HALF your plate fruits and vegetables.</text>
<text x="28" y="492" font-size="13">• Make HALF your grains whole grains; vary your protein.</text>
<text x="28" y="514" font-size="13">• Choose low-fat / fat-free dairy; drink water, not sugary drinks.</text>
<text x="28" y="536" font-size="13">• Limit added sugars, saturated fat, and sodium.</text>
</svg>
