<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 386" role="img" aria-label="Note and Rest Values">
<title>Note and Rest Values</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="818" height="386"/>
<text x="28" y="40" font-size="26" font-weight="700">Note &amp; Rest Values</text>
<text x="28" y="64" font-size="13" class="faint">duration in 4/4 time (quarter note = 1 beat)</text>
<ellipse cx="68" cy="150" rx="13" ry="9" transform="rotate(-20 68 150)" fill="#fff" stroke="var(--oe-svg-ink,#111)" stroke-width="2"/>
<text x="68" y="200" font-size="22" text-anchor="middle" font-weight="700">4</text>
<text x="68" y="222" font-size="11" text-anchor="middle" class="faint">beats</text>
<text x="68" y="250" font-size="13" text-anchor="middle" font-weight="700">Whole note</text>
<text x="68" y="268" font-size="11" text-anchor="middle" class="faint">+ whole rest</text>
<ellipse cx="218" cy="150" rx="13" ry="9" transform="rotate(-20 218 150)" fill="#fff" stroke="var(--oe-svg-ink,#111)" stroke-width="2"/>
<line x1="230" y1="146" x2="230" y2="84" class="rule"/>
<text x="218" y="200" font-size="22" text-anchor="middle" font-weight="700">2</text>
<text x="218" y="222" font-size="11" text-anchor="middle" class="faint">beats</text>
<text x="218" y="250" font-size="13" text-anchor="middle" font-weight="700">Half note</text>
<text x="218" y="268" font-size="11" text-anchor="middle" class="faint">+ half rest</text>
<ellipse cx="368" cy="150" rx="13" ry="9" transform="rotate(-20 368 150)" fill="var(--oe-svg-ink,#111)" stroke="var(--oe-svg-ink,#111)" stroke-width="2"/>
<line x1="380" y1="146" x2="380" y2="84" class="rule"/>
<text x="368" y="200" font-size="22" text-anchor="middle" font-weight="700">1</text>
<text x="368" y="222" font-size="11" text-anchor="middle" class="faint">beat</text>
<text x="368" y="250" font-size="13" text-anchor="middle" font-weight="700">Quarter note</text>
<text x="368" y="268" font-size="11" text-anchor="middle" class="faint">+ quarter rest</text>
<ellipse cx="518" cy="150" rx="13" ry="9" transform="rotate(-20 518 150)" fill="var(--oe-svg-ink,#111)" stroke="var(--oe-svg-ink,#111)" stroke-width="2"/>
<line x1="530" y1="146" x2="530" y2="84" class="rule"/>
<path d="M530,84 q 18,6 14,26" fill="none" stroke="var(--oe-svg-ink,#111)" stroke-width="2.5"/>
<text x="518" y="200" font-size="22" text-anchor="middle" font-weight="700">½</text>
<text x="518" y="222" font-size="11" text-anchor="middle" class="faint">beats</text>
<text x="518" y="250" font-size="13" text-anchor="middle" font-weight="700">Eighth note</text>
<text x="518" y="268" font-size="11" text-anchor="middle" class="faint">+ eighth rest</text>
<ellipse cx="668" cy="150" rx="13" ry="9" transform="rotate(-20 668 150)" fill="var(--oe-svg-ink,#111)" stroke="var(--oe-svg-ink,#111)" stroke-width="2"/>
<line x1="680" y1="146" x2="680" y2="84" class="rule"/>
<path d="M680,84 q 18,6 14,26" fill="none" stroke="var(--oe-svg-ink,#111)" stroke-width="2.5"/>
<path d="M680,97 q 18,6 14,26" fill="none" stroke="var(--oe-svg-ink,#111)" stroke-width="2.5"/>
<text x="668" y="200" font-size="22" text-anchor="middle" font-weight="700">¼</text>
<text x="668" y="222" font-size="11" text-anchor="middle" class="faint">beats</text>
<text x="668" y="250" font-size="13" text-anchor="middle" font-weight="700">Sixteenth note</text>
<text x="668" y="268" font-size="11" text-anchor="middle" class="faint">+ sixteenth rest</text>
<text x="28" y="310" font-size="13" class="faint">Each value is half the one above: 1 whole = 2 halves = 4 quarters = 8 eighths = 16 sixteenths.</text>
<text x="28" y="332" font-size="13" class="faint">A dot adds half the value (dotted half = 3 beats). A tie joins two notes into one sound.</text>
<text x="28" y="354" font-size="13" class="faint">Eighth &amp; shorter notes carry flags, or are beamed together when grouped.</text>
</svg>
