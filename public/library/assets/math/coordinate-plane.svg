<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 494" role="img" aria-label="The Coordinate Plane">
<title>The Coordinate Plane</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="740" height="494"/>
<text x="28" y="40" font-size="26" font-weight="700">The Coordinate Plane</text>
<text x="28" y="66" font-size="13" class="faint">x-axis (horizontal) and y-axis (vertical) cross at the origin (0, 0).</text>
<rect x="28" y="74" width="380" height="380" class="cell"/>
<line x1="28" y1="74" x2="28" y2="454" class="rule-faint"/>
<line x1="66" y1="74" x2="66" y2="454" class="rule-faint"/>
<line x1="104" y1="74" x2="104" y2="454" class="rule-faint"/>
<line x1="142" y1="74" x2="142" y2="454" class="rule-faint"/>
<line x1="180" y1="74" x2="180" y2="454" class="rule-faint"/>
<line x1="256" y1="74" x2="256" y2="454" class="rule-faint"/>
<line x1="294" y1="74" x2="294" y2="454" class="rule-faint"/>
<line x1="332" y1="74" x2="332" y2="454" class="rule-faint"/>
<line x1="370" y1="74" x2="370" y2="454" class="rule-faint"/>
<line x1="408" y1="74" x2="408" y2="454" class="rule-faint"/>
<line x1="28" y1="454" x2="408" y2="454" class="rule-faint"/>
<line x1="28" y1="416" x2="408" y2="416" class="rule-faint"/>
<line x1="28" y1="378" x2="408" y2="378" class="rule-faint"/>
<line x1="28" y1="340" x2="408" y2="340" class="rule-faint"/>
<line x1="28" y1="302" x2="408" y2="302" class="rule-faint"/>
<line x1="28" y1="226" x2="408" y2="226" class="rule-faint"/>
<line x1="28" y1="188" x2="408" y2="188" class="rule-faint"/>
<line x1="28" y1="150" x2="408" y2="150" class="rule-faint"/>
<line x1="28" y1="112" x2="408" y2="112" class="rule-faint"/>
<line x1="28" y1="74" x2="408" y2="74" class="rule-faint"/>
<line x1="218" y1="74" x2="218" y2="454" class="rule"/>
<line x1="28" y1="264" x2="408" y2="264" class="rule"/>
<circle cx="332" cy="188" r="4" class="fill-faint"/>
<text x="339" y="184" font-size="10">(3, 2)</text>
<text x="316.8" y="165.2" font-size="13" text-anchor="middle" font-weight="700">I  (+, +)</text>
<text x="119.2" y="165.2" font-size="13" text-anchor="middle" font-weight="700">II  (−, +)</text>
<text x="119.2" y="362.8" font-size="13" text-anchor="middle" font-weight="700">III  (−, −)</text>
<text x="316.8" y="362.8" font-size="13" text-anchor="middle" font-weight="700">IV  (+, −)</text>
<text x="404" y="257" font-size="13" text-anchor="end" class="faint">x</text>
<text x="225" y="87" font-size="13" class="faint">y</text>
<text x="28" y="480" font-size="12" class="faint">A point is (x, y): x first (right +/left −), y second (up +/down −). Order matters: (3,2) ≠ (2,3).</text>
</svg>
