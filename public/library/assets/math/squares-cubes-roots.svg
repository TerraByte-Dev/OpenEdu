<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 482" role="img" aria-label="Squares, Cubes &amp; Roots">
<title>Squares, Cubes &amp; Roots</title>
<style>
  text{font-family:'IBM Plex Mono','Consolas','Courier New',monospace;fill:var(--oe-svg-ink,#111);}
  .oe-bg{fill:var(--oe-svg-bg,#ffffff);}
  .faint{fill:var(--oe-svg-faint,#777);}
  .rule{stroke:var(--oe-svg-rule,#333);fill:none;stroke-width:1;}
  .rule-faint{stroke:var(--oe-svg-faint,#bbb);fill:none;stroke-width:1;}
  .cell{fill:var(--oe-svg-bg,#ffffff);stroke:var(--oe-svg-rule,#333);stroke-width:1;}
  .fill-faint{fill:var(--oe-svg-faint,#777);}
  .b{font-weight:700;}
</style>
<rect class="oe-bg" x="0" y="0" width="644" height="482"/>
<text x="28" y="50" font-size="26" font-weight="700">Squares, Cubes &amp; Roots</text>
<text x="28" y="91" font-size="17" font-weight="700">Perfect squares n²</text>
<text x="28" y="120" font-size="15" xml:space="preserve">1  4  9  16  25  36  49  64  81  100</text>
<text x="28" y="145" font-size="15" xml:space="preserve">121  144  169  196  225   (11–15)</text>
<text x="28" y="170" font-size="15" xml:space="preserve">256  289  324  361  400   (16–20)    625=25²   900=30²</text>
<text x="28" y="207" font-size="17" font-weight="700">Perfect cubes n³</text>
<text x="28" y="236" font-size="15" xml:space="preserve">1  8  27  64  125  216  343  512  729  1000</text>
<text x="28" y="261" font-size="15" xml:space="preserve">1331=11³    1728=12³</text>
<text x="28" y="298" font-size="17" font-weight="700">Powers of 2</text>
<text x="28" y="327" font-size="15" xml:space="preserve">2  4  8  16  32  64  128  256  512  1024</text>
<text x="28" y="364" font-size="17" font-weight="700">Common irrationals</text>
<text x="28" y="393" font-size="15" xml:space="preserve">√2≈1.414   √3≈1.732   √5≈2.236   √7≈2.646   √10≈3.162</text>
<text x="28" y="418" font-size="15" xml:space="preserve">π≈3.14159    e≈2.71828    φ≈1.618</text>
<text x="28" y="448" font-size="14">√(ab) = √a·√b. The radical symbol means the principal (positive) root.</text>
</svg>
